  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- No maximum-scale, no user-scalable=no. Both block pinch-zoom and text
         scaling, which is how someone with low vision reads a page at all.
         These are usually added to stop iOS auto-zooming when a small input is
         focused; the fix for that is a >=16px font on the input, not taking
         zoom away from everyone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EVA AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="EVA AI assistant for RAG chat, project analysis, and automatic code patch suggestions." />
    <link rel="apple-touch-icon" href="/logo192.png" />

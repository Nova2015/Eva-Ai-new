name: EVA Branch Tests

on:
  push:
    branches:
      - eva-source-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    name: Cognitive learning regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "fastapi>=0.110,<1" "pydantic>=2.6,<3" python-dotenv httpx "python-jose[cryptography]" "passlib[bcrypt]" slowapi google-auth email-validator requests python-multipart

      - name: Run cognitive learning regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
          LEARNING_CAPTURE_DEFAULT: "false"
          TRAIN_ADMIN_KEY: "ci-test-only"
          SECRET_KEY: "ci-only-not-a-production-secret-rotate-never-use-in-deployment"
        run: |
          python -m pytest -q -rs src/test_learning_loop_cognitive.py src/cognitive/test_chat_integration.py src/test_ml_health_probe.py

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend unit tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --runInBand

      - name: Check Electron entrypoint syntax
        working-directory: frontend
        run: node --check electron.js && node --check agent-api-helper.js && node --check preload.js

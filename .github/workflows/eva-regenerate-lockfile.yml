name: Regenerate frontend lockfile

on:
  push:
    branches:
      - eva-source-import
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/eva-regenerate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: eva-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 3
